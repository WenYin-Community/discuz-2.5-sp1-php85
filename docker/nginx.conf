server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html index.htm;

    charset gb2312;
    client_max_body_size 16m;

    # 附件目录可访问（老程序依赖），但禁止执行其中的脚本
    location ~* ^/attachments/.*\.(php|php[0-9]?|phtml|pht|phar|shtml|htm|html)$ {
        deny all;
    }
    location ~* ^/customavatars/.*\.(php|php[0-9]?|phtml|pht|phar|shtml|htm|html)$ {
        deny all;
    }

    # 运行时数据与一次性工具不得通过 Web 访问
    location ^~ /forumdata/ {
        deny all;
    }
    location ^~ /utilities/ {
        deny all;
    }

    # 安装程序：仅内网可用。
    # 注意：精确匹配 location 不会继承下面的 ~ \.php$ 规则，必须显式转发给 php-fpm，
    # 否则 nginx 会把 install.php 当静态文件返回，导致源码泄露。
    location = /install.php {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
