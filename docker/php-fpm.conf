; 覆盖镜像自带 [www] 池的关键项
; 以宿主 uid/gid 运行，保证 forumdata/ 生成物归 zemi 所有，便于直接编辑

[www]
user = 1000
group = 1000
listen = 9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
catch_workers_output = yes
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
