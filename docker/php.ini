; Discuz! 2.5F SP1 运行时配置（PHP 8.5）
; 注意：本包模板编译器会输出短开标签 <?，必须保持 short_open_tag=On

short_open_tag = On

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /proc/self/fd/2

; 页面正文为 GBK, 默认字符集必须与之一致，否则浏览器按 UTF-8 解码会出现方块/乱码
default_charset = gb2312

date.timezone = Asia/Shanghai

memory_limit = 256M
max_execution_time = 300
upload_max_filesize = 8M
post_max_size = 16M
max_file_uploads = 20

; 本程序自带会话跟踪（不依赖 PHP session），但保留默认配置
session.save_handler = files
session.gc_maxlifetime = 3600

; 保持与老代码一致的宽松行为
mysqli.default_port = 3306
