; 覆盖镜像自带 [www] 池的关键项
; 以宿主 uid/gid 运行，保证 forumdata/ 生成物归 zemi 所有，便于直接编辑

[www]
; 配合 podman-compose 的 userns_mode: keep-id, 容器内 1000 = 宿主当前用户,
; 这样 fpm 写出的 forumdata 缓存/模板文件在宿主上仍归当前用户所有
user = 1000
group = 1000
listen = 9000

; Discuz! 2.5 使用 ./forumdata/... 等相对路径写缓存与模板,
; 必须让工作目录与 mod_php 一致（脚本所在目录），否则缓存写入会失败
chdir = /var/www/html

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
catch_workers_output = yes
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
